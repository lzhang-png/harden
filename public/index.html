<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Roadmap — Brand & Growth Deliverables</title>
<meta name="description" content="Phased design roadmap covering brand foundations through product & experiential deliverables.">
<meta property="og:title" content="Design Roadmap — Brand & Growth Deliverables">
<meta property="og:description" content="A phased plan of design deliverables to drive enterprise credibility and growth.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f9fb;--surface:#fff;--border:#e2e5eb;
    --text:#1a1d23;--text-sec:#555d6e;--text-tert:#8891a0;
    --accent-1:#4f46e5;--accent-1-bg:#eef2ff;
    --accent-2:#0891b2;--accent-2-bg:#ecfeff;
    --accent-3:#d97706;--accent-3-bg:#fffbeb;
    --accent-4:#059669;--accent-4-bg:#ecfdf5;
    --accent-5:#7c3aed;--accent-5-bg:#f5f3ff;
    --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  html{font-size:15px;scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.25rem}
  #gate h2{font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
  #gate p{color:var(--text-sec);font-size:.95rem;max-width:320px;text-align:center}
  #gate form{display:flex;gap:.5rem}
  #gate input{padding:.6rem 1rem;border:1px solid var(--border);border-radius:8px;font-size:.95rem;outline:none;width:200px;transition:border-color .2s}
  #gate input:focus{border-color:var(--accent-1)}
  #gate button{padding:.6rem 1.25rem;background:var(--accent-1);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s}
  #gate button:hover{background:#4338ca}
  #gate .error{color:#dc2626;font-size:.85rem;min-height:1.2em}

  .container{max-width:960px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
  header{text-align:center;margin-bottom:3rem}
  header h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.5rem}
  header p{color:var(--text-sec);font-size:1.05rem;max-width:540px;margin:0 auto}
  .phase{margin-bottom:2.25rem}
  .phase-header{display:flex;align-items:center;gap:.65rem;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--border)}
  .phase-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.25rem .65rem;border-radius:100px;white-space:nowrap}
  .phase-title{font-size:1.15rem;font-weight:600}
  .phase--1 .phase-badge{background:var(--accent-1-bg);color:var(--accent-1)}
  .phase--1 .phase-header{border-color:var(--accent-1)}
  .phase--2 .phase-badge{background:var(--accent-2-bg);color:var(--accent-2)}
  .phase--2 .phase-header{border-color:var(--accent-2)}
  .phase--3 .phase-badge{background:var(--accent-3-bg);color:var(--accent-3)}
  .phase--3 .phase-header{border-color:var(--accent-3)}
  .phase--4 .phase-badge{background:var(--accent-4-bg);color:var(--accent-4)}
  .phase--4 .phase-header{border-color:var(--accent-4)}
  .phase--5 .phase-badge{background:var(--accent-5-bg);color:var(--accent-5)}
  .phase--5 .phase-header{border-color:var(--accent-5)}
  .cards{display:grid;gap:1rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;box-shadow:var(--shadow);transition:box-shadow .2s}
  .card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap}
  .card-category{font-weight:600;font-size:1rem}
  .card-purpose{font-size:.85rem;color:var(--text-sec);background:var(--bg);padding:.3rem .7rem;border-radius:6px;line-height:1.4;flex-shrink:0}
  .card ul{list-style:none;padding:0}
  .card li{position:relative;padding-left:1.15rem;margin-bottom:.35rem;color:var(--text);font-size:.93rem}
  .card li::before{content:'';position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--text-tert)}
  footer{text-align:center;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);color:var(--text-tert);font-size:.82rem}

  @media(max-width:600px){
    .container{padding:1.5rem 1rem 3rem}
    header h1{font-size:1.5rem}
    .card-top{flex-direction:column;gap:.5rem}
    .card-purpose{align-self:flex-start}
  }
  @media print{
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>

<div id="gate">
  <h2>This page is protected</h2>
  <p>Enter the passcode to view the Design Roadmap.</p>
  <form id="gate-form">
    <input type="password" id="gate-input" placeholder="Passcode" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
  </form>
  <span class="error" id="gate-error"></span>
</div>

<div id="content"></div>

<script>
(function(){
  var gate=document.getElementById('gate');
  var content=document.getElementById('content');

  if(sessionStorage.getItem('_token')){
    loadContent(sessionStorage.getItem('_token'));
    return;
  }

  document.getElementById('gate-form').addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.querySelector('#gate-form button');
    var inp=document.getElementById('gate-input');
    btn.disabled=true;btn.textContent='Checking\u2026';
    fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:inp.value})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.ok){
          sessionStorage.setItem('_token',d.token);
          loadContent(d.token);
        } else {
          document.getElementById('gate-error').textContent='Incorrect passcode. Please try again.';
          inp.value='';inp.focus();
        }
      })
      .catch(function(){document.getElementById('gate-error').textContent='Something went wrong. Try again.'})
      .finally(function(){btn.disabled=false;btn.textContent='Enter'});
  });

  function loadContent(token){
    fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.ok){
          gate.style.display='none';
          content.innerHTML=d.html;
        } else {
          sessionStorage.removeItem('_token');
          gate.style.display='';
        }
      });
  }
})();
</script>
</body>
</html>
